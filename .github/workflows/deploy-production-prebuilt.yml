# Authorized production prebuilt deployment workflow.
name: Prebuilt Production Deploy

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-production-prebuilt.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-production-prebuilt.yml"

permissions:
  contents: read

concurrency:
  group: prebuilt-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy prebuilt production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[prebuilt-deploy]')) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[prebuilt-deploy]'))
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Vercel deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "::error::Missing GitHub Actions secret VERCEL_TOKEN"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "::error::Missing GitHub Actions secret VERCEL_ORG_ID"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::Missing GitHub Actions secret VERCEL_PROJECT_ID"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack and install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate
          pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Pull production project settings
        working-directory: apps/backoffice-web
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        working-directory: apps/backoffice-web
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifact to production
        working-directory: apps/backoffice-web
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
